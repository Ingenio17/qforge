# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # nbsphinx converts the tutorial notebook through pandoc.
    - pandoc

sphinx:
  configuration: docs/conf.py

# Install the docs toolchain, then qforge itself, so autodoc can import the
# engines and build the API reference from real signatures and docstrings.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
