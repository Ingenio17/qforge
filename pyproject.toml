[build-system]
requires = ["setuptools>=65.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qforge"
version = "0.1.1"
description = "End-to-end quantum simulation toolkit from qubit physics to hardware design"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Saumya Shah"}
]
keywords = ["quantum", "simulation", "superconducting", "qubits", "hardware", "transmon", "fluxonium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "scqubits>=4.0",
    "qutip>=5.0",
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    # Note: qiskit-metal requires C++ compiler on Windows, optional for now
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "plotext>=5.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "tqdm>=4.60",
    "h5py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
hardware = [
    # Install separately if needed: pip install qforge[hardware]
    "qiskit-metal>=0.1",
]

[project.scripts]
qforge = "qforge.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Ingenio17/qforge"
Documentation = "https://qforge.readthedocs.io"
Repository = "https://github.com/Ingenio17/qforge"
Issues = "https://github.com/Ingenio17/qforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=qforge --cov-report=term-missing --cov-report=html"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: marks tests requiring hardware design tools",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
